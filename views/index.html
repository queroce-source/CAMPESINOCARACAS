<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Campo - CEC</title>
  <link rel="stylesheet" href="/css/estilos.css">
  <style>
    body { display: flex; justify-content: center; align-items: center; min-height: 90vh; padding: 20px 10px; }
    .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 420px; box-sizing: border-box; border-top: 5px solid var(--naranja); }
    .logo-container { text-align: center; margin-bottom: 15px; }
    .logo-container img { max-width: 220px; height: auto; }
    h2 { color: var(--azul-marino); margin-top: 5px; margin-bottom: 20px; font-size: 20px; text-align: center; font-weight: 700; }
    .form-group { margin-bottom: 16px; position: relative; }
    label { font-weight: 600; font-size: 13px; color: var(--azul-marino); margin-bottom: 6px; display: block; }
    input[type="text"], textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--borde-input); border-radius: 6px; font-size: 14px; box-sizing: border-box; outline: none; }
    input[type="text"]:focus, textarea:focus { border-color: var(--naranja); }
    input[readonly] { background-color: #e2e8f0; color: #475569; font-weight: bold; cursor: not-allowed; }
    .dropdown-list { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid var(--borde-input); border-radius: 0 0 6px 6px; max-height: 180px; overflow-y: auto; z-index: 1000; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
    .dropdown-item { padding: 10px 12px; font-size: 13px; cursor: pointer; border-bottom: 1px solid #f1f5f9; }
    .dropdown-item:hover { background-color: var(--naranja); color: white; }
    .btn-submit { width: 100%; background: var(--naranja); color: white; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; }
    .btn-submit:hover { background: var(--naranja-hover); }
    .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }
    .msg-gps { color: var(--rojo); font-size: 12px; font-weight: bold; text-align: center; margin-top: 10px; }
    .camara-container { width: 100%; border: 2px dashed var(--borde-input); border-radius: 8px; overflow: hidden; background: #f8fafc; text-align: center; }
    .camara-container video { width: 100%; display: block; }
    .camara-container .placeholder { padding: 30px 10px; color: #94a3b8; font-size: 14px; }
    .btn-foto { width: 100%; background: var(--azul-marino); color: white; border: none; padding: 10px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 6px; transition: 0.2s; }
    .btn-foto:hover { background: #1e2d3a; }
    .btn-foto:disabled { background: #94a3b8; cursor: not-allowed; }
    .foto-preview { width: 100%; border-radius: 6px; margin-top: 6px; display: none; }
    .foto-tomada { border: 2px solid #16a34a; border-radius: 8px; }
  </style>
</head>
<body>

<div class="card">
  <div class="logo-container">
    <img id="logoCEC" src="/logo.jpeg" alt="Corporación El Campesino">
  </div>
  <h2>Registro de Campo</h2>
  <form id="registroForm">
    <div class="form-group">
      <label>Tipo de Registro (Automático):</label>
      <input type="text" id="tipoRegistro" readonly value="Cargando hora...">
    </div>
    <div class="form-group">
      <label for="buscarVendedor">Buscar Vendedor (Código o Nombre):</label>
      <input type="text" id="buscarVendedor" placeholder="Escribe tu código o nombre..." autocomplete="off">
      <div id="listaVendedores" class="dropdown-list"></div>
      <input type="hidden" id="codigoVendedorSelected">
    </div>
    <div class="form-group">
      <label>Nombre Vendedor:</label>
      <input type="text" id="nombreVendedor" readonly placeholder="Aparecerá automáticamente">
    </div>
    <div class="form-group">
      <label for="comentario">Observación / Comentario <span id="lblComentarioReq" style="color:#dc2626;font-weight:bold;">(Obligatorio para Salida)</span>:</label>
      <textarea id="comentario" rows="3" placeholder="Escribe alguna novedad u observación aquí..."></textarea>
    </div>
    <div class="form-group">
      <label>Foto obligatoria (Cámara en vivo):</label>
      <div class="camara-container" id="camaraContainer">
        <div class="placeholder" id="camaraPlaceholder">Presiona "Iniciar Cámara" para tomar la foto</div>
        <video id="camaraVideo" autoplay playsinline style="display:none;"></video>
      </div>
      <button type="button" id="btnIniciarCamara" class="btn-foto">📷 Iniciar Cámara</button>
      <button type="button" id="btnTomarFoto" class="btn-foto" style="display:none;">📸 Tomar Foto</button>
      <canvas id="camaraCanvas" style="display:none;"></canvas>
      <img id="fotoPreview" class="foto-preview" alt="Vista previa">
    </div>
    <div id="msgGps" class="msg-gps">Obteniendo ubicación GPS...</div>
    <button type="submit" id="btnEnviar" class="btn-submit" disabled>Enviar Registro</button>
  </form>
</div>

<script>
  let listaVendedoresGlobal = [];
  let latitudUsuario = null;
  let longitudUsuario = null;
  let fotoBase64Capturada = null;
  let camaraStream = null;

  function formatearFechaDispositivo() {
    const ahora = new Date();
    const y = ahora.getFullYear();
    const m = String(ahora.getMonth() + 1).padStart(2, '0');
    const d = String(ahora.getDate()).padStart(2, '0');
    const h = String(ahora.getHours()).padStart(2, '0');
    const min = String(ahora.getMinutes()).padStart(2, '0');
    const s = String(ahora.getSeconds()).padStart(2, '0');
    return `${y}-${m}-${d} ${h}:${min}:${s}`;
  }

  function definirTipoRegistro() {
    const hora = new Date().getHours();
    const tipo = hora < 13 ? "ENTRADA (Mañana)" : "SALIDA (Tarde)";
    document.getElementById('tipoRegistro').value = tipo;
    const lbl = document.getElementById('lblComentarioReq');
    if (tipo.includes('SALIDA')) {
      lbl.style.display = 'inline';
    } else {
      lbl.style.display = 'none';
    }
  }

  function obtenerUbicacion() {
    const msgGps = document.getElementById('msgGps');
    const btnEnviar = document.getElementById('btnEnviar');
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          latitudUsuario = pos.coords.latitude;
          longitudUsuario = pos.coords.longitude;
          msgGps.style.color = "#16a34a";
          msgGps.innerText = "✓ Ubicación GPS confirmada";
          if (fotoBase64Capturada) btnEnviar.disabled = false;
        },
        (err) => {
          msgGps.style.color = "#dc2626";
          msgGps.innerText = "Error: Debes activar el GPS y permitir el acceso a tu ubicación.";
          btnEnviar.disabled = true;
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    } else {
      msgGps.innerText = "Tu navegador no soporta geolocalización.";
    }
  }

  async function cargarVendedores() {
    try {
      const res = await fetch('/api/vendedores');
      const result = await res.json();
      listaVendedoresGlobal = result.data || [];
    } catch (e) {
      console.error("Error al cargar vendedores", e);
    }
  }

  function iniciarCamara() {
    const video = document.getElementById('camaraVideo');
    const placeholder = document.getElementById('camaraPlaceholder');
    const btnIniciar = document.getElementById('btnIniciarCamara');
    const btnTomar = document.getElementById('btnTomarFoto');

    if (camaraStream) {
      detenerCamara();
      return;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert("Tu navegador no soporta acceso a la cámara. Usa un dispositivo móvil o Chrome actualizado.");
      return;
    }

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    }).then(stream => {
      camaraStream = stream;
      video.srcObject = stream;
      video.style.display = 'block';
      placeholder.style.display = 'none';
      btnIniciar.innerText = '❌ Detener Cámara';
      btnTomar.style.display = 'block';
    }).catch(err => {
      alert("No se pudo acceder a la cámara. Verifica los permisos.");
      console.error("Error cámara:", err);
    });
  }

  function detenerCamara() {
    if (camaraStream) {
      camaraStream.getTracks().forEach(t => t.stop());
      camaraStream = null;
    }
    const video = document.getElementById('camaraVideo');
    video.style.display = 'none';
    document.getElementById('camaraPlaceholder').style.display = 'block';
    document.getElementById('btnIniciarCamara').innerText = '📷 Iniciar Cámara';
    document.getElementById('btnTomarFoto').style.display = 'none';
  }

  function tomarFoto() {
    const video = document.getElementById('camaraVideo');
    const canvas = document.getElementById('camaraCanvas');
    const preview = document.getElementById('fotoPreview');

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);

    fotoBase64Capturada = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
    preview.src = `data:image/jpeg;base64,${fotoBase64Capturada}`;
    preview.style.display = 'block';

    detenerCamara();

    const btnEnviar = document.getElementById('btnEnviar');
    if (latitudUsuario) btnEnviar.disabled = false;
  }

  const inputBuscar = document.getElementById('buscarVendedor');
  const listaContainer = document.getElementById('listaVendedores');

  inputBuscar.addEventListener('input', function() {
    const filtro = this.value.trim().toLowerCase();
    listaContainer.innerHTML = '';
    if (!filtro) { listaContainer.style.display = 'none'; return; }
    const coincidencias = listaVendedoresGlobal.filter(v =>
      String(v.codigo).toLowerCase().includes(filtro) ||
      String(v.nombre).toLowerCase().includes(filtro)
    );
    if (coincidencias.length === 0) {
      listaContainer.innerHTML = `<div class="dropdown-item" style="color:#888;">Sin coincidencias</div>`;
    } else {
      coincidencias.forEach(v => {
        const item = document.createElement('div');
        item.className = 'dropdown-item';
        item.innerText = `${v.codigo} - ${v.nombre}`;
        item.onclick = function() {
          inputBuscar.value = `${v.codigo} - ${v.nombre}`;
          document.getElementById('codigoVendedorSelected').value = v.codigo;
          document.getElementById('nombreVendedor').value = v.nombre;
          listaContainer.style.display = 'none';
        };
        listaContainer.appendChild(item);
      });
    }
    listaContainer.style.display = 'block';
  });

  document.addEventListener('click', function(e) {
    if (!inputBuscar.contains(e.target) && !listaContainer.contains(e.target)) {
      listaContainer.style.display = 'none';
    }
  });

  document.getElementById('btnIniciarCamara').addEventListener('click', iniciarCamara);
  document.getElementById('btnTomarFoto').addEventListener('click', tomarFoto);

  document.getElementById('registroForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const codigo = document.getElementById('codigoVendedorSelected').value;
    const nombre = document.getElementById('nombreVendedor').value;
    const tipo = document.getElementById('tipoRegistro').value;
    const comentario = document.getElementById('comentario').value;
    const btnEnviar = document.getElementById('btnEnviar');

    if (!codigo || !nombre) {
      alert("Por favor busca y selecciona un vendedor válido de la lista.");
      return;
    }
    if (!fotoBase64Capturada) {
      alert("Debes tomar una foto en vivo con la cámara.");
      return;
    }
    if (tipo.includes('SALIDA') && !comentario.trim()) {
      alert("Debe ingresar una observación o comentario para registrar la salida.");
      document.getElementById('comentario').focus();
      return;
    }

    if (camaraStream) detenerCamara();

    btnEnviar.disabled = true;
    btnEnviar.innerText = "Enviando registro...";

    try {
      const payload = {
        codigo, nombre, tipo,
        comentario: comentario,
        latitud: latitudUsuario,
        longitud: longitudUsuario,
        fotoBase64: fotoBase64Capturada,
        fotoNombre: `foto_${codigo}_${Date.now()}.jpg`,
        fechaDispositivo: formatearFechaDispositivo()
      };

      const response = await fetch('/api/registros', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const result = await response.json();
      if (result.success) {
        alert("¡Registro enviado con éxito!");
        location.reload();
      } else {
        alert("Error al guardar: " + result.message);
      }
    } catch (err) {
      alert("Ocurrió un error al enviar la información.");
    } finally {
      btnEnviar.disabled = false;
      btnEnviar.innerText = "Enviar Registro";
    }
  });

  window.onload = function() {
    definirTipoRegistro();
    obtenerUbicacion();
    cargarVendedores();
  };
</script>
</body>
</html>
